<div class="card {{datoPokemon.fondo}}" style="width: 18rem;">
    <img src="{{datoPokemon.foto}}" class="card-img-top" alt="...">
    <div class="card-body">
        <h5 class="card-title">Nombre: {{datoPokemon.nombre}}</h5>
        <p class="card-text">Tipo: {{datoPokemon.tipo}}</p>
        <p class="card-text">Ataque: {{datoPokemon.ataque}}</p>
        <p class="card-text">No. {{datoPokemon.no}}</p>
    </div>
</div>
